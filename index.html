<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Money">
  <title>Pocket Money</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-ico">🪙</span>
        <span>Pocket Money</span>
      </div>
      <button id="btnInstall" class="install-btn hidden" title="Instalar app">📲 Instalar</button>
    </header>

    <!-- Conteúdo das telas -->
    <main id="content"></main>

    <!-- Menu inferior -->
    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="dashboard">
        <span class="tab-ico">🏠</span><span class="tab-label">Início</span>
      </button>
      <button class="tab" data-view="transactions">
        <span class="tab-ico">💰</span><span class="tab-label">Transações</span>
      </button>
      <button class="tab" data-view="invest">
        <span class="tab-ico">📈</span><span class="tab-label">Investir</span>
      </button>
      <button class="tab" data-view="accounts">
        <span class="tab-ico">🏦</span><span class="tab-label">Contas</span>
      </button>
      <button class="tab" data-view="settings">
        <span class="tab-ico">⚙️</span><span class="tab-label">Ajustes</span>
      </button>
    </nav>

    <!-- Modal genérico -->
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <button class="modal-close" id="modalClose" aria-label="Fechar">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
